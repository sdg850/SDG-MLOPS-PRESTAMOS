services:
  api:
    build: .
    environment:
      MODEL_PATH: /app/models/model.joblib
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
